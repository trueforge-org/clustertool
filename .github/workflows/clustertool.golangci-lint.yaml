name: clustertool-go-lint
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
on:
  pull_request:
    branches:
      - main
    paths:
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'embed/**'
      - '!embed/generic/**'
      - 'pkg/**'
      - 'partial_builds/**'
      - 'pkg/**'
      - ".github/workflows/clustertool.test.yaml"
      - '.github/workflows/clustertool.golangci-lint.yaml'
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on:
      group: default
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Go is provided by the self-hosted runner.
      # - name: Setup Go
      #   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      #   with:
      #     go-version: stable
      #     cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: >
            --timeout=3m
            --skip-dirs=embed/generic
            --enable-only=ineffassign,unused  # As a first start, can always add more linters later
