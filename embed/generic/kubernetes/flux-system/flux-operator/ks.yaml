---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
spec:
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: clusters/REPLACEWITHCLUSTERNAME/kubernetes/flux-system/flux-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
    namespace: flux-system
  targetNamespace: flux-system
  wait: true