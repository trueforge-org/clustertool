apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.2
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  values:
    crds:
      create: true
    replicaCount: 1 # When running multi node cluster, increase this.
    # monitoring:
    #   podMonitorEnabled: true
    #   grafanaDashboard:
    #     create: true
