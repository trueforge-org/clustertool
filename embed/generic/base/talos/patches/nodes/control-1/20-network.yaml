apiVersion: v1alpha1
kind: LinkAliasConfig
name: mgmt
selector:
    match: true  # as there is a single link only, we can match it this way
---
apiVersion: v1alpha1
kind: LinkConfig
name: mgmt
up: true
addresses:
  - address: ${CONTROL1IP}/24
routes:
  - gateway: ${GATEWAY}
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: ${VIP}
link: mgmt
