apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: flux-system
type: Opaque
stringData:
  # Required network settings (IP addresses without subnet prefixes).
  GATEWAY: 192.168.20.1
  VIP: 192.168.20.200
  # Please be aware, we only support x86_64 for the first node, ARM will NOT work by default
  CONTROL1IP: 192.168.20.210

  # Optional additional nodes:
  # CONTROL2IP: 192.168.20.211
  # WORKER1IP: 192.168.20.215

  # Cluster networks: do not alter.
  PODNET: 172.16.0.0/16
  SVCNET: 172.17.0.0/16

  # Domain settings for ClusterIssuer and Blocky; use a base domain (e.g. example.com).
  # Present values must not be empty.
  DOMAIN_0: ""
  DOMAIN_0_EMAIL: ""
  DOMAIN_0_CLOUDFLARE_TOKEN: ""

  # Flux repository (non-empty when present), e.g. ssh://git@github.com/owner/repo.git
  GIT_REPOSITORY: ""

  # Optional Docker Hub authentication: also copy talos/example-patches/44-registry-auth.yaml
  # to talos/patches/all/ or talos/patches/nodes/<name>/
  # DOCKERHUB_USER: dockerhub-username
  # DOCKERHUB_PASSWORD: dockerhub-password

  # Optional settings below: remove or comment out unused fields to skip validation.
  # Removing fields does not disable apps; adjust their helm-release.yaml settings.
  # Service IPs must fall within METALLB_RANGE when that range is set.
  METALLB_RANGE: 192.168.20.220-192.168.20.229
  # LAN only; do not port-forward.
  ENVOY_INTERNAL_IP: 192.168.20.220
  # LAN/WAN; port-forward at the router for external access.
  ENVOY_EXTERNAL_IP: 192.168.20.221
  BLOCKY_IP: 192.168.20.222
  HEADLAMP_IP: 192.168.20.223

  # Add your own secrets below