apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: flux-system
type: Opaque
stringData:
  ## The Following are required by clustertool and CANNOT be removed
  # Ensure VIP is different from all node IPs
  VIP: 192.168.20.200
  ## Defines the first control-plane IP (without a subnet prefix)
  # Please be aware, we only support x86_64 for the first node, ARM will NOT work by default
  CONTROL1IP: 192.168.20.210
  # Optional additional nodes:
  # CONTROL2IP: 192.168.20.211
  # WORKER1IP: 192.168.20.215
  # Defines the gateway for all nodes
  GATEWAY: 192.168.20.1
  # Defines the ip range metallb is allowed to use
  # Remove or comment out METALLB_RANGE to skip range validation. If present, it must be a valid start-end IP range.
  METALLB_RANGE: 192.168.20.220-192.168.20.229
  ##  IP's for NGINX, BLOCKY and HEADLAMP. Has to be within METALLB_RANGE and not in use
  # IP NGINX will use for exposing ingress-resources. Internal refers to LAN-only NGINX ingress, dont port-forward at router
  NGINX_INTERNAL_IP: 192.168.20.220
  # IP NGINX will use for exposing ingress-resources. Internal refers to LAN-and-WAN NGINX ingress, DO port-forward at router
  NGINX_EXTERNAL_IP: 192.168.20.221
  # BLOCKY_IP and HEADLAMP_IP may be removed or commented out to skip their validation.
  # If present, each must be a valid IP and fall within METALLB_RANGE when that range is configured.
  # IP Blocky DNS will be exposed on
  BLOCKY_IP: 192.168.20.222
  # Sets the Headlamp Kubernetes web UI IP
  HEADLAMP_IP: 192.168.20.223
  ## Configures ClusterIssuer and Blocky for said domain, using these credentials
  # domain is the base/highest level of your domain, so without subdomain, example: trueforge.org, not somesite.trueforge.org
  # To disable, please see the comments in their respective helm-values.yaml files!
  # These three fields may be removed or commented out to skip validation.
  # If present, each must be a non-empty string.
  DOMAIN_0: ""
  DOMAIN_0_EMAIL: ""
  DOMAIN_0_CLOUDFLARE_TOKEN: ""
  # Used to automatically generate a sshkey-pair for Flux
  # Remove or comment out GITHUB_REPOSITORY to skip validation. If present, it must be a non-empty string.
  # Has to start with ssh://
  # Please make sure to NOT contain any special characters in the URL except "-"
  GITHUB_REPOSITORY: ""
  ## To enable Docker Hub authentication, also copy talos/example-patches/44-registry-auth.yaml
  ## into talos/patches/all/ or talos/patches/nodes/<name>/.
  # DOCKERHUB_USER: dockerhub-username
  # DOCKERHUB_PASSWORD: dockerhub-password
  ## DO NOT ALTER
  PODNET: 172.16.0.0/16
  SVCNET: 172.17.0.0/16
